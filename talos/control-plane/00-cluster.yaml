cluster:
  allowSchedulingOnControlPlanes: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.1.0/24
---
apiVersion: v1alpha1
kind: KubeAPIServerConfig
extraArgs:
  # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
  # aggregator-routing is required when not using kube-proxy
  enable-aggregator-routing: true
certExtraSANs:
  - house.local
---
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# cilium handles what kube-proxy would do
apiVersion: v1alpha1
kind: KubeProxyConfig
enabled: false
---
# we install CoreDNS from a helm chart, don't need Talos's built-in one
apiVersion: v1alpha1
kind: KubeCoreDNSConfig
enabled: false
---
# cilium is the CNI; drop the Talos-managed Flannel document
apiVersion: v1alpha1
kind: KubeFlannelCNIConfig
$patch: delete
---
# drop TOPF's KubeNodeConfig (default NoSchedule taint) so v1alpha1
# allowSchedulingOnControlPlanes stays in effect
apiVersion: v1alpha1
kind: KubeNodeConfig
$patch: delete
