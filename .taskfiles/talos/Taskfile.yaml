version: '3'

vars:
  TOPFCONFIG: talos/topf.yaml
  # Use the cluster VIP; the node's own IP is not always reachable for kubeconfig.
  ENDPOINT: '{{.ENDPOINT | default "192.168.1.200"}}'

tasks:
  reset:
    desc: Reset cluster back to maintenance mode
    cmds:
      - topf reset --topfconfig {{.TOPFCONFIG}} --confirm=false --full=false --graceful=false
  genconfig:
    desc: Render Talos machine configs
    cmds:
      - mkdir -p clusterconfig
      - topf render --topfconfig {{.TOPFCONFIG}} --confirm=false --output clusterconfig
  apply:
    desc: Apply config
    cmds:
      - topf apply --topfconfig {{.TOPFCONFIG}} --confirm=false --mode=reboot
  upgrade:
    desc: Upgrade Talos
    cmds:
      # Single node: skip drain so the only control-plane is not cordoned.
      # Drop --drain=false when there are multiple nodes.
      - topf upgrade --topfconfig {{.TOPFCONFIG}} --confirm=false --drain=false
  kubeconfig:
    desc: "Regenerate the admin kubeconfig from Talos (fixes expired client certs)"
    cmds:
      - mkdir -p clusterconfig
      - topf talosconfig --topfconfig {{.TOPFCONFIG}} --confirm=false --redact=false > clusterconfig/talosconfig
      - talosctl --talosconfig clusterconfig/talosconfig config endpoint {{.ENDPOINT}}
      - talosctl --talosconfig clusterconfig/talosconfig config node {{.ENDPOINT}}
      # Refresh the repo-local kubeconfig (git-ignored).
      - talosctl --talosconfig clusterconfig/talosconfig -e {{.ENDPOINT}} -n {{.ENDPOINT}} kubeconfig ./kubeconfig --force
      # Merge fresh admin credentials into the user's default kubeconfig (used by kubectl/k9s).
      - talosctl --talosconfig clusterconfig/talosconfig -e {{.ENDPOINT}} -n {{.ENDPOINT}} kubeconfig ~/.kube/config --force --merge
