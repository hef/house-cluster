version: 3

tasks:
  talos:
    desc: Bootstrap the Talos cluster
    cmds:
      # TOPF uses insecure machine API automatically while the node is in maintenance mode.
      - until topf apply --topfconfig talos/topf.yaml --confirm=false --auto-bootstrap; do sleep 10; done
      - task: :talos:kubeconfig
      - until kubectl version; do sleep 10; done
        # renovate: datasource=github-releases depName=prometheus-operator/prometheus-operator
      - kubectl apply --server-side --filename https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.94.1/stripped-down-crds.yaml
      - helmfile -f helmfile.yaml sync
      - sops exec-file components/common/sops.sops.yaml "kubectl --namespace flux-system apply --server-side --filename {}"
        # renovate: datasource=github-releases depName=kubernetes-sigs/external-dns
      - kubectl apply --server-side --filename https://raw.githubusercontent.com/kubernetes-sigs/external-dns/refs/tags/v0.23.0/config/crd/standard/dnsendpoints.externaldns.k8s.io.yaml
        # renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
      - kubectl apply --server-side --filename https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.3/experimental-install.yaml
