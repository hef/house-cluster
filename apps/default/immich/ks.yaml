---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
  namespace: &namespace default
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/volsync
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: cnpg
      namespace: cnpg-system
    - name: barman-cloud
      namespace: cnpg-system
    - name: openebs
      namespace: kube-system
  interval: 1h
  path: ./apps/default/immich/app
  patches:
    # Keep the existing library PVC: files class + RWX, no restore dataSource
    # (dataSourceRef is immutable on an already-bound claim).
    - target:
        kind: PersistentVolumeClaim
      patch: |-
        - op: remove
          path: /spec/dataSourceRef
        - op: replace
          path: /spec/storageClassName
          value: host-zfs-files
    - target:
        kind: ReplicationDestination
      patch: |-
        - op: replace
          path: /spec/restic/storageClassName
          value: host-zfs-files
        - op: replace
          path: /spec/restic/accessModes/0
          value: ReadWriteMany
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      CLAIM: immich-library
      CAPACITY: 100Gi
      ACCESS_MODE: ReadWriteMany
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 15m
  wait: false
