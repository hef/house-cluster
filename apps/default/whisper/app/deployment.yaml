apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
  template:
    metadata:
      labels:
        app: whisper
    spec:
      containers:
        - name: whisper
          image: rhasspy/wyoming-whisper:3.9.1@sha256:ac3fdbdb4d6d7c5899634a63cfe4bac78634d27c7a1b061b2bb5d8f1054853b5
          args: ["--model", "tiny-int8", "--language", "en", "--data-dir", "/data"]
          ports:
            - containerPort: 10300
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 1Gi
                storageClassName: host-zfs-standard