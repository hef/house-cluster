---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: house-db
spec:
  enableSuperuserAccess: true
  instances: 1
  enablePDB: false
  primaryUpdateStrategy: unsupervised
  # Barman Cloud lives in the plugin sidecar; use standard instead of deprecated system-*.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  storage:
    size: 10Gi
    storageClass: host-zfs-postgres
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
      # ZFS CoW: no torn 8k pages (host-zfs-postgres recordsize=8k), so skip FPIs
      # and don't pre-zero/recycle WAL files.
      full_page_writes: "off"
      wal_init_zero: "off"
      wal_recycle: "off"
  bootstrap:
    initdb:
      database: app
      owner: app
      encoding: UTF8
      localeCollate: C
      localeCType: C
      postInitApplicationSQL:
        - GRANT CONNECT ON DATABASE app TO grafana
        - GRANT USAGE ON SCHEMA public TO grafana
        - GRANT SELECT ON ALL TABLES IN SCHEMA public TO grafana
        - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO grafana
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: house-db
  certificates:
    serverTLSSecret: house-db-server-cert
    serverCASecret: house-db-server-ca
  managed:
    roles:
      - name: grafana
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: grafana-db-secret
  monitoring:
    enablePodMonitor: false
